# 홈어시스턴트 자동화: 서빙 표시 앱(포스기)이 보내는 주방 방송을 매장주방홈미니에서 읽어 줍니다.
# 2026-11-28 HA 에 추가됨 (id chodang_kds_announce, automation.jubang_bangsong_seobing_pyosi_aeb).
# 기존 '안내 방송 (음성만)' 스크립트(DLNA media_player.maejang_hommini_tts, Edge TTS 선희)를 씀.
alias: 주방 방송 (서빙 표시 앱)
description: 포스기 서빙 표시 앱이 웹훅으로 보낸 문장(신규주문·메뉴변경·국/밥 알림·직접 방송)을 매장주방 홈미니에서 읽어 줌
mode: queued
max: 10
triggers:
  - trigger: webhook
    webhook_id: chodang_kds_announce
    allowed_methods:
      - POST
    local_only: true
conditions: []
actions:
  # 홈미니가 1분 넘게 '재생 중'에 멈춰 있으면(외부 재생 허용 대기 등) 먼저 멈춤
  - if:
      - condition: template
        value_template: >-
          {{ is_state("media_player.maejang_hommini_tts","playing") and
             (now() - states.media_player.maejang_hommini_tts.last_changed).total_seconds() > 60 }}
    then:
      - action: media_player.media_stop
        target:
          entity_id: media_player.maejang_hommini_tts
        continue_on_error: true
      - delay: 1
  - action: script.store_announce
    data:
      message: "{{ trigger.json.message }}"
      volume: 1.0
