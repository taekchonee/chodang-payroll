# 입구 LED 간판 자동 전환 (HA 패키지)
#
# 설치:
#   1. 이 파일을 HA 설정 폴더의 packages/led_sign.yaml 로 저장합니다.
#   2. configuration.yaml 에 아래가 없으면 추가합니다.
#        homeassistant:
#          packages: !include_dir_named packages
#   3. secrets.yaml 에 포스기 앱 화면에 나오는 값을 넣습니다.
#        led_sign_show_url: "http://192.168.0.xx:8765/show"
#        led_sign_key: "123456"
#   4. HA 를 다시 시작합니다.
#
# 영업 시간과 문구는 HA 화면(설정 > 기기 및 서비스 > 도우미)에서 바로 바꿀 수 있습니다.

rest_command:
  led_sign_show:
    url: !secret led_sign_show_url
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 90
    payload: >-
      {{ {"key": key, "text": text, "color": color | default("green"),
          "mode": mode | default("auto")} | to_json }}

input_select:
  led_sign_status:
    name: 간판 상태
    icon: mdi:sign-text
    options:
      - 영업중
      - 브레이크타임
      - 영업종료
      - 휴무
      - 재료소진 조기마감

input_datetime:
  store_open:
    name: 오픈 시간
    has_date: false
    has_time: true
    initial: "11:00"
  store_break_start:
    name: 브레이크 시작
    has_date: false
    has_time: true
    initial: "15:00"
  store_break_end:
    name: 브레이크 끝
    has_date: false
    has_time: true
    initial: "17:00"
  store_close:
    name: 마감 시간
    has_date: false
    has_time: true
    initial: "21:00"

input_boolean:
  store_use_break:
    name: 브레이크타임 사용
    icon: mdi:coffee
    initial: true
  store_closed_today:
    name: 오늘 임시 휴무
    icon: mdi:calendar-remove

input_text:
  led_sign_text_open:
    name: 문구 - 영업중
    initial: 영업중
  led_sign_text_break:
    name: 문구 - 브레이크타임
    initial: 브레이크타임
  led_sign_text_closed:
    name: 문구 - 영업종료
    initial: 영업종료
  led_sign_text_holiday:
    name: 문구 - 휴무
    initial: 월요일 휴무
  led_sign_text_soldout:
    name: 문구 - 조기마감
    initial: 재료소진 조기마감

script:
  led_sign_soldout:
    alias: 재료소진 조기마감
    icon: mdi:food-off
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.led_sign_status
        data:
          option: 재료소진 조기마감

automation:
  # 1) 시간에 맞춰 간판 상태를 바꿉니다.
  - id: led_sign_schedule
    alias: 간판 - 영업 시간표
    mode: queued
    trigger:
      - platform: time
        at: input_datetime.store_open
        id: open
      - platform: time
        at: input_datetime.store_break_start
        id: break_start
      - platform: time
        at: input_datetime.store_break_end
        id: break_end
      - platform: time
        at: input_datetime.store_close
        id: close
      - platform: homeassistant
        event: start
        id: recalc
      - platform: state
        entity_id:
          - input_boolean.store_closed_today
          - input_boolean.store_use_break
        id: recalc
    action:
      - variables:
          now_t: "{{ now().strftime('%H:%M:%S') }}"
          t_open: "{{ states('input_datetime.store_open') }}"
          t_bs: "{{ states('input_datetime.store_break_start') }}"
          t_be: "{{ states('input_datetime.store_break_end') }}"
          t_close: "{{ states('input_datetime.store_close') }}"
          is_monday: "{{ now().weekday() == 0 }}"
          use_break: "{{ is_state('input_boolean.store_use_break', 'on') }}"
          closed_today: "{{ is_state('input_boolean.store_closed_today', 'on') }}"
          soldout: "{{ is_state('input_select.led_sign_status', '재료소진 조기마감') }}"
          target: >-
            {%- if is_monday or closed_today -%}휴무
            {%- elif now_t < t_open or now_t >= t_close -%}영업종료
            {%- elif use_break and t_bs <= now_t < t_be -%}브레이크타임
            {%- else -%}영업중
            {%- endif -%}
      # 조기마감을 눌러 둔 날은 마감 시간 전까지 그대로 둡니다.
      - condition: template
        value_template: "{{ not soldout or target in ['영업종료', '휴무'] }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.led_sign_status
        data:
          option: "{{ target }}"

  # 2) 간판 상태가 바뀌면 포스기 앱으로 문구를 보냅니다.
  - id: led_sign_send
    alias: 간판 - 문구 보내기
    mode: restart
    trigger:
      - platform: state
        entity_id: input_select.led_sign_status
    action:
      - variables:
          s: "{{ states('input_select.led_sign_status') }}"
          text: >-
            {% set m = {'영업중': 'input_text.led_sign_text_open',
                        '브레이크타임': 'input_text.led_sign_text_break',
                        '영업종료': 'input_text.led_sign_text_closed',
                        '휴무': 'input_text.led_sign_text_holiday',
                        '재료소진 조기마감': 'input_text.led_sign_text_soldout'} %}
            {{ states(m[s]) if s in m else s }}
          color: >-
            {{ {'영업중': 'green', '브레이크타임': 'yellow'}.get(s, 'red') }}
      - action: rest_command.led_sign_show
        data:
          key: !secret led_sign_key
          text: "{{ text }}"
          color: "{{ color }}"
        response_variable: result
      - if:
          - condition: template
            value_template: "{{ result.status != 200 }}"
        then:
          - action: persistent_notification.create
            data:
              title: 간판 문구 변경 실패
              message: "'{{ text }}' 전송 실패: {{ result.content }}"

  # 3) 다음 날 임시 휴무 표시를 자동으로 끕니다.
  - id: led_sign_reset_daily
    alias: 간판 - 임시 휴무 초기화
    trigger:
      - platform: time
        at: "04:00:00"
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.store_closed_today
