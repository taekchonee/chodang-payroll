<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>초당예반 주방</title>
<style>
:root{--bg:#0F1117;--card:#181B23;--line:#262A35;--text:#E8EAF0;--sub:#888780;--green:#5DCAA5;--amber:#EF9F27;--red:#E24B4A;--btn:#1D9E75}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:2;flex-wrap:wrap}
.logo{background:var(--btn);color:#fff;font-size:13px;font-weight:700;padding:3px 9px;border-radius:6px}
.title{font-size:18px;font-weight:700}
.live{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--green)}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.live.bad{color:var(--red)}
.pill{font-size:15px;padding:5px 12px;border-radius:8px}
.clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;margin-left:6px}
.sound.off{background:#EF9F27;color:#1E1200;font-weight:700;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.5}}
.sound{background:var(--line);color:var(--text);border:none;border-radius:8px;height:34px;padding:0 12px;font-size:14px}
.batch{display:flex;gap:10px;padding:0 16px 12px;flex-wrap:wrap;justify-content:center}
.batch:empty{display:none}
.batch div{background:#2A1F0A;border:1px solid #633806;color:#FAC775;border-radius:12px;padding:10px 22px;font-size:24px;font-weight:700}
.batch span{font-size:15px;color:#BA7517;font-weight:400;margin-right:8px}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));align-content:start;grid-auto-rows:max-content;gap:14px;padding:0 16px 14px}
.tk{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tk>*{flex-shrink:0}
.tk .bar{height:5px}
.top{display:flex;align-items:flex-start;padding:14px 16px 8px}
.tag{font-size:14px;padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:3px}
.tno{font-size:46px;font-weight:700;line-height:1.05}
.tno small{font-size:18px;color:var(--sub);font-weight:400;margin-left:2px}
.time{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;font-weight:700;text-align:right}
.time small{display:block;font-size:11px;color:var(--sub);font-weight:400;font-family:inherit}
.prog{height:4px;background:var(--line);margin:0 16px 10px;border-radius:2px}
.prog i{display:block;height:4px;border-radius:2px}
.it{display:flex;align-items:center;font-size:23px;padding:7px 16px}
.qty{min-width:36px;height:36px;border-radius:8px;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;margin-left:auto;padding:0 6px}
.it .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.it.batchy .qty{background:#633806;color:#FAC775}
.it.dim{color:#A8ABB5}
.it.dim .qty{color:#A8ABB5}
.it.cx .nm{text-decoration:line-through;color:#F09595}
.it.cx .qty{background:#501313;color:#F7C1C1;margin-left:0}
.cxl{font-size:13px;color:#fff;background:#E24B4A;border-radius:6px;padding:1px 7px;margin-left:auto;margin-right:8px}
.tk.void{background:#2A1416;outline:2px solid #E24B4A}
.voidmsg{margin:auto 14px 14px;height:62px;border-radius:12px;background:#501313;color:#F7C1C1;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chipcx{outline:1px solid #A32D2D}
.addsep{display:flex;align-items:center;gap:8px;margin:8px 16px 2px;font-size:13px;color:#FAC775}
.addsep::before,.addsep::after{content:"";flex:1;height:1px;background:#633806}
.at{font-size:15px;color:#FAC775;font-family:ui-monospace,Menlo,Consolas,monospace;margin-left:4px}
.ext{font-size:15px;color:#888780;padding:4px 16px 0;line-height:1.5}
.done{margin:auto 14px 14px;height:62px;border-radius:12px;border:none;background:var(--btn);color:#fff;font-size:21px;font-weight:700;cursor:pointer}
.done:active{background:#0F6E56}
footer{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line);background:#0B0D12;min-height:54px}
.sep{font-size:13px;color:var(--sub);white-space:nowrap}
#serve{display:flex;gap:8px;overflow-x:auto;flex:1}
#serve:empty::after{content:"없음";color:#5F5E5A;font-size:13px}
.chip{background:var(--card);border-radius:10px;padding:5px 6px 5px 10px;display:flex;align-items:center;gap:8px;font-size:13px;flex:0 0 auto;max-width:300px}
.chip b{font-size:17px;color:#9FE1CB}
.chip .d{color:#B4B2A9;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.undo{background:var(--line);border:none;color:#B4B2A9;border-radius:7px;height:30px;padding:0 10px;font-size:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);font-size:20px;padding:60px 0}
/* ===== 큰 글씨 (2026-11-28, v2): 카드는 한 화면에 2장 + 다음 카드 살짝, 좌우로 넘김. 카드 안 내용이 길면 위아래로 넘김 ===== */
#grid{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;gap:18px;padding:4px 18px 16px;align-items:stretch;-webkit-overflow-scrolling:touch}
.tk{flex:0 0 calc((100vw - 54px) / 2.12);scroll-snap-align:start;overflow-y:auto;border-radius:20px}
.tk .bar{height:10px}
.top{padding:18px 22px 10px}
.tag{font-size:22px;padding:4px 12px;border-radius:8px;margin-bottom:6px}
.tno{font-size:96px;line-height:1}
.tno small{font-size:30px}
.time{font-size:56px}
.time small{font-size:18px}
.prog{height:8px;margin:0 22px 14px}
.prog i{height:8px}
.it{font-size:44px;padding:10px 22px;font-weight:600}
.qty{min-width:68px;height:64px;font-size:42px;border-radius:12px;padding:0 10px}
.it .nm{margin-right:16px}
.cxl{font-size:22px;padding:3px 10px}
.addsep{font-size:24px;margin:14px 22px 4px;gap:12px}
.addsep::before,.addsep::after{height:2px}
.at{font-size:30px;margin-left:8px}
.ext{font-size:28px;padding:8px 22px 0}
.done,.voidmsg{height:100px;font-size:38px;border-radius:16px;margin:auto 18px 18px}
.batch div{font-size:38px;padding:12px 30px}
.batch span{font-size:22px}
.empty{flex:1;font-size:36px}
.title{font-size:24px}
.pill{font-size:20px}
.clock{font-size:32px}
footer{min-height:72px}
.sep{font-size:18px}
.chip{font-size:20px;padding:8px 8px 8px 14px;max-width:460px}
.chip b{font-size:28px}
.undo{height:44px;font-size:18px;padding:0 14px}
</style>
</head>
<body>
<header>
  <span class="logo">KDS</span><span class="title">초당예반 주방</span>
  <span id="live" class="live"><i></i><span id="liveText">연결 중</span></span>
  <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <button id="sound" class="sound off">화면을 눌러 알림음 켜기</button>
    <span class="pill" style="background:#3A1B1B;color:#F09595">조리 대기 <b id="cq">0</b></span>
    <span class="pill" style="background:#123A2E;color:#9FE1CB">서빙 대기 <b id="cs">0</b></span>
  </span>
  <span id="clk" class="clock">--:--</span>
</header>
<div id="batch" class="batch"></div>
<div id="grid"></div>
<footer><span class="sep">조리완료 · 서빙 대기</span><div id="serve"></div></footer>
<script>
let lastCancel=0,state={tickets:[],low:[],batch:[],extra:[]},offset=0,lastOk=0,seen=null,audio=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isLow=n=>state.low.some(k=>n.includes(k));
const isExtra=n=>(state.extra||[]).some(k=>n.includes(k));
const isBatch=n=>state.batch.some(k=>n.includes(k));
function col(s,add){const c=state.cfg||{amber:300,red:600};if(add)return'#EF9F27';return s>=c.red?'#E24B4A':s>=c.amber?'#EF9F27':'#5DCAA5'}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function now(){return Date.now()+offset}
function beep(){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.25,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.6);o.start();o.stop(audio.currentTime+.6)}
function soundOn(){if(audio&&audio.state==='running')return;audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();$('sound').textContent='소리 켜짐';$('sound').classList.remove('off');beep()}
$('sound').onclick=soundOn;document.addEventListener('pointerdown',soundOn,{once:true});
if(navigator.userAgent.includes('ChodangKDS')){soundOn();$('sound').style.display='none'}
async function load(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'});const j=await r.json();
    const hv=j.cfg&&j.cfg.html;if(window._hv===undefined)window._hv=hv;else if(hv!==window._hv){location.reload();return}
    offset=j.now-Date.now();j.tickets=j.tickets.filter(t=>!t.served);state=j;lastOk=Date.now();
    const ids=new Set(j.tickets.filter(t=>!t.cooked&&!t.voided).map(t=>t.id));
    const cx=Math.max(0,...j.tickets.map(t=>Math.max(t.cancelAt||0,t.voided||0)));
    if(seen){if([...ids].some(id=>!seen.has(id)))beep();if(cx>lastCancel)alarm()}
    lastCancel=cx;
    const sig=JSON.stringify(j.tickets);if(sig!==window._sig){window._sig=sig;render()}
    seen=ids;
  }catch(e){}
}
function alarm(){if(!audio)return;[0,.25,.5].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=440;o.connect(g);g.connect(audio.destination);const t=audio.currentTime+d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2)})}
function kindTag(t,rank){
  if(t.voided)return'<span class="tag" style="background:#E24B4A;color:#fff">주문 취소</span>';
  if(t.kind==='change')return'<span class="tag" style="background:#26215C;color:#CECBF6">변경</span>';
  if(t.add)return'<span class="tag" style="background:#412402;color:#FAC775">추가 주문</span>';
  return '<span class="tag" style="background:'+(rank==0?'#501313':'#262A35')+';color:'+(rank==0?'#F7C1C1':'#B4B2A9')+'">'+(rank==0?'1 · 다음':(rank+1))+'</span>';
}
const moved=t=>t.movedFrom?'<span class="tag" style="background:#04342C;color:#9FE1CB;margin-left:4px">'+esc(t.movedFrom)+'번→이동</span>':'';
const cxRows=t=>(t.cancelled||[]).filter(([n])=>!isExtra(n)).map(([n,q])=>'<div class="it cx"><span class="nm">'+esc(n)+'</span><span class="cxl">취소</span><span class="qty">'+q+'</span></div>').join('');
function render(){
  const pri=t=>t.voided?0:(t.add?1:2);
  const open=state.tickets.filter(t=>!t.cooked||t.voided).sort((a,b)=>(pri(a)-pri(b))||(a.created-b.created));
  const done=state.tickets.filter(t=>t.cooked&&!t.voided).sort((a,b)=>b.cooked-a.cooked);
  $('cq').textContent=open.filter(t=>!t.voided).length;$('cs').textContent=done.length;
  const sum={};open.filter(t=>!t.voided).forEach(t=>t.items.forEach(([n,q])=>{if(isBatch(n))sum[n]=(sum[n]||0)+q}));
  $('batch').innerHTML=Object.entries(sum).map(([n,q])=>'<div><span>묶음 조리</span>'+esc(n)+' '+q+'</div>').join('');
  let rank=0;
  $('grid').innerHTML=open.length?open.map(t=>{
    const s=(now()-t.created)/1000,c=t.voided?'#E24B4A':col(s,false);
    const tag=kindTag(t,rank);if(!t.voided&&!t.add)rank++;
    const addSum={};(t.adds||[]).forEach(([n,q])=>addSum[n]=(addSum[n]||0)+q);
    const row=(n,q,at)=>'<div class="it'+(isBatch(n)?' batchy':'')+(isLow(n)?' dim':'')+'"><span class="nm">'+(at?'<span style="color:#FAC775;margin-right:4px">+</span>':'')+esc(n)+(at?' <span class="at" data-at="'+at+'">('+fmt((now()-at)/1000)+')</span>':'')+'</span><span class="qty">'+q+'</span></div>';
    const base=t.items.map(([n,q])=>[n,q-(addSum[n]||0)]).filter(([n,q])=>q>0&&!isExtra(n));
    const addRows=(t.adds||[]).filter(([n,q])=>q>0&&!isExtra(n));
    const items=t.voided?(t.items.concat(t.cancelled||[])).filter(([n])=>!isExtra(n)).map(([n,q])=>'<div class="it cx"><span class="nm">'+esc(n)+'</span><span class="qty">'+q+'</span></div>').join('')
      :base.map(([n,q])=>row(n,q,0)).join('')+(addRows.length?'<div class="addsep"><span>추가</span></div>'+addRows.map(([n,q,at])=>row(n,q,at)).join(''):'')+cxRows(t);
    return '<div class="tk'+(t.voided?' void':'')+'"'+(t.voided?'':' data-c="'+t.created+'" data-a="'+(t.add?1:0)+'"')+'><div class="bar" style="background:'+c+'"></div>'+
      '<div class="top"><div>'+tag+moved(t)+'<div class="tno">'+esc(t.table)+'<small>번</small></div></div>'+
      '<div class="time" style="margin-left:auto;color:'+c+'"><span>'+(t.voided?'취소':fmt(s))+'</span><small>'+(t.voided?'조리 중지':'경과')+'</small></div></div>'+
      '<div class="prog"><i style="background:'+c+';width:'+(t.voided?100:Math.min(100,s/((state.cfg&&state.cfg.red)||600)/1.5*100))+'%"></i></div>'+items+
      (!t.voided&&t.items.some(([n])=>isExtra(n))?'<div class="ext">'+t.items.filter(([n])=>isExtra(n)).map(([n,q])=>esc(n)+' '+q).join(' · ')+'</div>':'')+
      '<div style="height:10px"></div>'+(t.voided?'<div class="voidmsg">주문이 취소되었습니다</div>':'<button class="done" data-id="'+t.id+'">조리완료</button>')+'</div>'
  }).join(''):'<div class="empty">조리할 주문이 없습니다</div>';
  $('serve').innerHTML=done.map(t=>'<div class="chip'+((t.cancelled||[]).length?' chipcx':'')+'"><b>'+esc(t.table)+'번</b><span class="d">'+t.items.filter(([n])=>!isExtra(n)).map(([n,q])=>esc(n)+' '+q).join(' · ')+((t.cancelled||[]).filter(([n])=>!isExtra(n)).length?' <s style="color:#F09595">'+t.cancelled.filter(([n])=>!isExtra(n)).map(([n,q])=>esc(n)+' '+q).join(' · ')+'</s> <span style="color:#F09595">취소</span>':'')+'</span><span class="ago" data-cooked="'+t.cooked+'" style="color:var(--sub);font-size:12px">'+Math.floor((now()-t.cooked)/60000)+'분 전</span><button class="undo" data-undo="'+t.id+'">되돌리기</button></div>').join('');
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('.done'),u=e.target.closest('.undo');
  if(b){b.disabled=true;b.textContent='…';await fetch('/api/cook?id='+b.dataset.id,{method:'POST'}).catch(()=>{});setTimeout(load,300)}
  if(u){await fetch('/api/undo?id='+u.dataset.undo,{method:'POST'}).catch(()=>{});setTimeout(load,300)}
});
setInterval(()=>{
  const d=new Date(now());$('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const ago=Math.floor((Date.now()-lastOk)/1000),bad=!lastOk||ago>6;
  $('live').className='live'+(bad?' bad':'');$('liveText').textContent=bad?(lastOk?'연결 끊김 · '+ago+'초 전':'연결 중'):'실시간';
  tick();
},1000);
function tick(){document.querySelectorAll(".tk[data-c]").forEach(el=>{const s=(now()-(+el.dataset.c))/1000,c=col(s,el.dataset.a=="1");el.querySelector(".bar").style.background=c;const tm=el.querySelector(".time");tm.style.color=c;tm.querySelector("span").textContent=fmt(s);const p=el.querySelector(".prog i");p.style.background=c;p.style.width=Math.min(100,s/((state.cfg&&state.cfg.red)||600)/1.5*100)+"%"});document.querySelectorAll(".ago[data-cooked]").forEach(el=>{el.textContent=Math.floor((now()-(+el.dataset.cooked))/60000)+"분 전"});document.querySelectorAll(".at[data-at]").forEach(el=>{el.textContent="("+fmt((now()-(+el.dataset.at))/1000)+")"})}
setInterval(load,1500);load();
</script>
</body>
</html>
