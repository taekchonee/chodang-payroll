name: LED 간판 앱 빌드

on:
  push:
    paths:
      - "android/**"
      - "config/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: APK 빌드
        run: gradle -p android assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk led-sign.apk
          cp android/servemark/build/outputs/apk/release/servemark-release.apk serve-mark.apk
          cp android/kds/build/outputs/apk/release/kds-release.apk kitchen.apk
          c() { echo $((100 + $(git rev-list --count HEAD -- "android/$1"))); }
          echo "{\"led-sign\": $(c app), \"serve-mark\": $(c servemark), \"kitchen\": $(c kds)}" > version.json
          cat version.json
          cp config/settings.json settings.json
          cp config/kds.html kds.html

      - uses: actions/upload-artifact@v4
        with:
          name: led-sign-apk
          path: |
            led-sign.apk
            serve-mark.apk
            kitchen.apk

      - name: 다운로드용 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=led-sign-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "LED 간판 앱 (최신)" \
              --notes "포스기에서 led-sign.apk 를 내려받아 설치하세요."
          fi
          gh release upload "$TAG" led-sign.apk serve-mark.apk kitchen.apk version.json settings.json kds.html --clobber
